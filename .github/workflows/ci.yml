name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Frontend tests
        run: pnpm test

      - name: Rust format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      # The `trace` feature (timing logs for instrumented builds) is off by default; this keeps
      # its code compiling and its tests passing.
      - name: Rust tests (trace feature)
        working-directory: src-tauri
        run: cargo test --features trace

      - name: Personal-data check
        run: scripts/check-no-personal-data.sh

      - name: Cask syntax
        run: |
          # Render to a file first: a failing render must fail the step, not feed ruby empty input.
          scripts/render-cask.sh 0.0.0 "$(printf '%064d' 0)" > "$RUNNER_TEMP/cask.rb"
          ruby -c "$RUNNER_TEMP/cask.rb"

      - name: Build the app (debug, no DMG)
        run: pnpm tauri build --debug --bundles app

  # What exists of the Windows port, compiled and tested on a Windows runner. The Unix-only tests
  # (bash fakes, /bin/sh, scripts/fake-herdr) are gated out with #[cfg(unix)], and the tests in
  # scripts/ (most drive bash scripts) run only on macOS. The build checks that the NSIS installer bundles; nothing is
  # uploaded.
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # The runner checks out with CRLF line endings by default; the tests read files byte for byte.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Frontend tests (not the bash script tests)
        run: pnpm vitest run --exclude "scripts/**"

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build the app (debug, NSIS installer)
        run: pnpm tauri build --debug --bundles nsis

  # A test build for every pull request: the same universal, ad-hoc signed DMG a release ships,
  # attached to the run as an artifact so a branch can be installed and tried before it merges.
  # Read-only, like the release build: it runs the project's dependencies and holds no write token.
  # Dependabot PRs skip it (they change CI actions, not the app), to save macOS minutes. Fork PRs
  # skip it too: it would build and publish a DMG from code the maintainer has not read.
  preview:
    needs: check
    if: ${{ github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: macos-14
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Build the universal app and DMG
        run: pnpm tauri build --target universal-apple-darwin

      # The DMG keeps the release's name, plus the PR number and short commit, so two test builds
      # are never confused with each other or with a release.
      - name: Collect the DMG
        id: dmg
        env:
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          bundle="src-tauri/target/universal-apple-darwin/release/bundle"
          out="$RUNNER_TEMP/preview"
          mkdir -p "$out"
          dmg=$(ls "$bundle"/dmg/*.dmg | head -n 1)
          name=$(basename "$dmg" .dmg)
          name="${name// /.}-pr${PR}-${SHA:0:7}"
          cp "$dmg" "$out/$name.dmg"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          ls -l "$out"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: ${{ steps.dmg.outputs.name }}
          path: ${{ runner.temp }}/preview/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        env:
          NAME: ${{ steps.dmg.outputs.name }}
          URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo "### Test build"
            echo
            echo "[$NAME.dmg]($URL) (a zip holding the DMG; kept 14 days)."
            echo
            echo "Ad-hoc signed and not notarized, like a release: the README's first-launch steps apply."
          } >> "$GITHUB_STEP_SUMMARY"
