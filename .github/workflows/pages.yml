name: Pages

# Deploys the project site (site/) to GitHub Pages. It rebuilds when the site changes and when a
# release is published, so the Download buttons always point at the latest public DMG.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/build-site.sh"
      - ".github/workflows/pages.yml"
  release:
    types: [published]
  workflow_dispatch:

# Read-only by default; only the deploy job gets the Pages permissions.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # configure-pages reads the site's settings; it writes nothing.
      pages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Latest published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)" >> "$GITHUB_OUTPUT"

      # The tag reaches the script through the environment, never pasted into the shell line.
      - name: Build
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: scripts/build-site.sh "$TAG"

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
